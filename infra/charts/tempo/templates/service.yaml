apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "tempo.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
    - name: otlp-grpc
      port: {{ .Values.ports.otlpGrpc }}
      targetPort: otlp-grpc
