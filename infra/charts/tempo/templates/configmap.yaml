apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
data:
  tempo.yaml: |
    server:
      http_listen_port: {{ .Values.ports.http }}
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:{{ .Values.ports.otlpGrpc }}
    compactor:
      compaction:
        block_retention: {{ .Values.retention }}
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
