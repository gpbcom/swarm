apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "otel-collector.labels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.grpc }}
        - protocol: TCP
          port: {{ .Values.ports.http }}
