apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.ports.grpc }}
          http:
            endpoint: 0.0.0.0:{{ .Values.ports.http }}
            cors:
              allowed_origins: {{ toJson .Values.cors.allowedOrigins }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
          - key: cell
            value: {{ .Values.cell | quote }}
            action: upsert
      attributes/redact:
        actions:
          {{- range .Values.redactedKeys }}
          - key: {{ . | quote }}
            action: delete
          {{- end }}
      transform/redact:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              {{- range .Values.redactedKeys }}
              - delete_key(attributes, {{ . | quote }})
              {{- end }}
      transform/drone_id:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - delete_key(attributes, "drone_id")
      tail_sampling:
        decision_wait: 10s
        policies:
          - name: errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: slow
            type: latency
            latency:
              threshold_ms: {{ .Values.sampling.slowThresholdMs }}
          - name: rest
            type: probabilistic
            probabilistic:
              sampling_percentage: {{ .Values.sampling.percentage }}
      batch: {}
    exporters:
      otlp:
        endpoint: {{ .Values.exporters.tempo.endpoint | quote }}
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: {{ .Values.exporters.prometheus.endpoint | quote }}
      otlphttp:
        endpoint: {{ .Values.exporters.loki.endpoint | quote }}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, attributes/redact, tail_sampling, batch]
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, attributes/redact, transform/drone_id, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, attributes/redact, transform/redact, batch]
          exporters: [otlphttp]
