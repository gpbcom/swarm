apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "otel-collector.labels" . | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.ports.grpc }}
      targetPort: otlp-grpc
    - name: otlp-http
      port: {{ .Values.ports.http }}
      targetPort: otlp-http
