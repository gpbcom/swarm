apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: {{ .Values.datasources.prometheusUrl }}
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: {{ .Values.datasources.lokiUrl }}
        jsonData:
          derivedFields:
            - name: trace_id
              matcherRegex: '"?trace_id"?[=:]\s*"?(\w+)"?'
              url: '$${__value.raw}'
              datasourceUid: tempo
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: {{ .Values.datasources.tempoUrl }}
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
            customQuery: true
            query: '{} |= "$${__span.traceId}"'
