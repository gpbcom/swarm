apiVersion: v2
name: cell
description: Umbrella chart of one cell, bringing its NATS cluster, data platform and vault configuration.
type: application
version: 0.1.0
dependencies:
  - name: database
    repository: file://../database
    version: 0.1.0
    condition: database.enabled
  - name: valkey
    repository: file://../valkey
    version: 0.1.0
    condition: valkey.enabled
  - name: object-storage
    alias: objectStorage
    repository: file://../object-storage
    version: 0.1.0
    condition: objectStorage.enabled
  - name: vault-config
    alias: vaultConfig
    repository: file://../vault-config
    version: 0.1.0
    condition: vaultConfig.enabled
  - name: nats
    repository: file://../nats
    version: 0.1.0
    condition: nats.enabled
  - name: simulator
    repository: file://../simulator
    version: 0.1.0
    condition: simulator.enabled
  - name: otel-collector
    alias: otelCollector
    repository: file://../otel-collector
    version: 0.1.0
    condition: otelCollector.enabled
  - name: prometheus
    repository: file://../prometheus
    version: 0.1.0
    condition: prometheus.enabled
  - name: loki
    repository: file://../loki
    version: 0.1.0
    condition: loki.enabled
  - name: tempo
    repository: file://../tempo
    version: 0.1.0
    condition: tempo.enabled
  - name: grafana
    repository: file://../grafana
    version: 0.1.0
    condition: grafana.enabled
