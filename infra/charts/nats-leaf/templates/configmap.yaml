apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-leaf-config
  labels:
    app.kubernetes.io/name: nats-leaf
data:
  nats.conf: |
    server_name: $POD_NAME
    port: {{ .Values.ports.client }}
    http_port: {{ .Values.ports.monitor }}
    jetstream {
      store_dir: /data/jetstream
      domain: {{ include "nats-leaf.domain" . | quote }}
    }
    leafnodes {
      remotes: [
        {
          url: {{ include "nats-leaf.remoteUrl" . | quote }}
          credentials: "/etc/nats-leaf-credentials/edge.creds"
          tls {
            cert_file: "/etc/nats-leaf-tls/tls.crt"
            key_file: "/etc/nats-leaf-tls/tls.key"
            ca_file: "/etc/nats-leaf-tls/ca.crt"
          }
        }
      ]
    }
