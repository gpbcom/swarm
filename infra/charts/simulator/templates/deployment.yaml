{{- include "simulator.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  labels:
    app.kubernetes.io/name: simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simulator
    spec:
      containers:
        - name: simulator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/conf/app.yaml
              subPath: app.yaml
              readOnly: true
            - name: nats-credentials
              mountPath: /etc/simulator/nats
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: simulator-config
        - name: nats-credentials
          secret:
            secretName: {{ .Values.nats.credentialsSecretName }}
            items:
              - key: creds
                path: creds
