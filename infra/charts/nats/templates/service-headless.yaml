apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  labels:
    app.kubernetes.io/name: nats
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: {{ .Values.ports.client }}
      targetPort: client
    - name: cluster
      port: {{ .Values.ports.cluster }}
      targetPort: cluster
    - name: monitor
      port: {{ .Values.ports.monitor }}
      targetPort: monitor
