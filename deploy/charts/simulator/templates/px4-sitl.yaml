{{- include "simulator.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: px4-sitl
  labels:
    app.kubernetes.io/name: px4-sitl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: px4-sitl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: px4-sitl
    spec:
      containers:
        - name: px4-sitl
          image: "{{ .Values.px4Sitl.image.repository }}:{{ .Values.px4Sitl.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.px4Sitl.port }}
              protocol: UDP
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: px4-sitl
  labels:
    app.kubernetes.io/name: px4-sitl
spec:
  selector:
    app.kubernetes.io/name: px4-sitl
  ports:
    - name: mavlink
      port: {{ .Values.px4Sitl.port }}
      targetPort: {{ .Values.px4Sitl.port }}
      protocol: UDP
