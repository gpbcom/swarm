apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
