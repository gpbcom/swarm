[package]
name = "swarm-desktop"
version = "0.1.0"
description = "The Swarm desktop shell: Ground control and Mission studio in native windows."
edition = "2021"
publish = false

# The shell is built apart from `packages/rust`: it has its own empty workspace.
[workspace]

[lib]
name = "swarm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = [] }

# The lints of `packages/rust/Cargo.toml`.
[lints.clippy]
all = "deny"
pedantic = "warn"

[lints.rust]
missing_docs = "warn"
