[project]
name = "swarm-missions"
version = "0.1.0"
description = "The Swarm missions service."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.164.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0",
    "swarm-lifecycle",
    "swarm-logging",
    "swarm-catalog",
    "swarm-models",
    "swarm-storage",
    "swarm-rest",
]

[project.scripts]
swarm-missions-serve = "missions.api.cli.serve_main:main"
swarm-missions-openapi = "missions.api.cli.openapi_main:main"
swarm-missions-migrate = "missions.api.cli.migrate_main:main"

[tool.uv.build-backend]
module-name = "missions"

[tool.uv.sources]
swarm-lifecycle = { workspace = true }
swarm-logging = { workspace = true }
swarm-catalog = { workspace = true }
swarm-models = { workspace = true }
swarm-storage = { workspace = true }
swarm-rest = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
