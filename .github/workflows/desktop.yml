name: desktop

on:
  pull_request:
    branches:
      - develop
      - master
      - "release/**"
    paths:
      - "frontends/desktop/**"
      - "frontends/ground-control/**"
      - "frontends/mission-studio/**"
      - "packages/ts/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"
  push:
    branches:
      - master
      - develop
      - "release/**"
      - "hotfix/**"
    paths:
      - "frontends/desktop/**"
      - "frontends/ground-control/**"
      - "frontends/mission-studio/**"
      - "packages/ts/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install the toolchain of rust-toolchain.toml
        working-directory: frontends/desktop/src-tauri
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontends/desktop/src-tauri
      - name: Install the Linux libraries of Tauri
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the desktop shell
        run: pnpm --filter @swarm/desktop tauri build --no-bundle
      - name: Check the format
        if: matrix.os == 'ubuntu-latest'
        working-directory: frontends/desktop/src-tauri
        run: cargo fmt --check
      - name: Run clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: frontends/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
