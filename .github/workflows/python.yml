name: python

on:
  workflow_call:
    inputs:
      services:
        description: "Compact JSON array of the services to check, as printed by detect_changes.py."
        type: string
        required: true
      repository:
        description: "Whether to run the repository tests and lint the CI scripts."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  services:
    if: inputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    env:
      SERVICE: ${{ matrix.service }}
      NATS_SERVER_VERSION: "2.15.3"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install the workspace
        run: uv sync --locked
      - name: Find the folder, the sources and the tests of the app
        run: |
          # An app's tests are those of its main, then those of each domain it lists in [tool.swarm] domains.
          tests="tests/swarm_${SERVICE//-/_}"
          sources="backend/apps/$SERVICE/src"
          domains=$(uv run python -c "import sys, tomllib; print(' '.join(tomllib.load(open(sys.argv[1], 'rb'))['tool']['swarm']['domains']))" "backend/apps/$SERVICE/pyproject.toml")
          for domain in $domains; do
            for folder in tests/swarm_*/"$domain" tests/swarm_api/v1/"$domain"; do
              if [ -d "$folder" ]; then
                tests="$tests $folder"
              fi
            done
            for folder in backend/swarm-*/src/swarm_*/"$domain" backend/swarm-api/src/swarm_api/v1/"$domain"; do
              if [ -d "$folder" ]; then
                sources="$sources $folder"
              fi
            done
          done
          echo "FOLDER=backend/apps/$SERVICE" >> "$GITHUB_ENV"
          echo "SOURCES=$sources" >> "$GITHUB_ENV"
          echo "TESTS=$tests" >> "$GITHUB_ENV"
      - name: Install nats-server
        run: |
          base="https://github.com/nats-io/nats-server/releases/download/v$NATS_SERVER_VERSION"
          archive="nats-server-v$NATS_SERVER_VERSION-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --remote-name "$base/$archive"
          curl --fail --silent --show-error --location --remote-name "$base/SHA256SUMS"
          sha256sum --check --ignore-missing SHA256SUMS
          mkdir -p "$HOME/.local/bin"
          tar --extract --gzip --file "$archive" --strip-components=1 --directory "$HOME/.local/bin" "nats-server-v$NATS_SERVER_VERSION-linux-amd64/nats-server"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nats-server" --version
      - name: Build and install the swarm_core wheel
        run: |
          # The code of an app is its main and the code of its domains: SOURCES holds several folders.
          # shellcheck disable=SC2086
          if grep -rqsE '(^|\s)(import|from) swarm_core' $SOURCES; then
            uv run maturin build --release --manifest-path rust/swarm-core/python/Cargo.toml --out dist
            uv pip install --no-deps dist/swarm_core-*.whl
          else
            echo "$SERVICE does not import swarm_core: the wheel is not applicable."
          fi
      - name: Ruff check
        run: uv run ruff check "$FOLDER"
      - name: Ruff format check
        run: uv run ruff format --check "$FOLDER"
      - name: Mypy
        run: |
          if [ -d "$FOLDER/src" ]; then
            uv run mypy "$FOLDER/src"
          else
            echo "No source folder for $SERVICE: mypy is not applicable."
          fi
      - name: Pytest
        run: |
          # TESTS holds several folders for an app: its main's tests and the tests of its domains.
          # shellcheck disable=SC2086
          if [ -n "$(find $TESTS -name 'test_*.py' -print -quit 2>/dev/null)" ]; then
            uv run pytest $TESTS -n 2 --junitxml="reports/service-$SERVICE.xml"
          else
            echo "No tests for $SERVICE: pytest is not applicable."
          fi
      - name: Keep the test reports (TKT-26)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-python-service-${{ matrix.service }}
          path: reports/
          if-no-files-found: ignore

  repository:
    if: inputs.repository
    runs-on: ubuntu-latest
    env:
      NATS_SERVER_VERSION: "2.15.3"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install the workspace
        run: uv sync --locked
      - name: Install nats-server
        run: |
          base="https://github.com/nats-io/nats-server/releases/download/v$NATS_SERVER_VERSION"
          archive="nats-server-v$NATS_SERVER_VERSION-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --remote-name "$base/$archive"
          curl --fail --silent --show-error --location --remote-name "$base/SHA256SUMS"
          sha256sum --check --ignore-missing SHA256SUMS
          mkdir -p "$HOME/.local/bin"
          tar --extract --gzip --file "$archive" --strip-components=1 --directory "$HOME/.local/bin" "nats-server-v$NATS_SERVER_VERSION-linux-amd64/nats-server"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nats-server" --version
      - name: Build and install the swarm_core wheel
        run: |
          uv run maturin build --release --manifest-path rust/swarm-core/python/Cargo.toml --out dist
          uv pip install --no-deps dist/swarm_core-*.whl
      - name: Ruff check
        run: uv run ruff check tests .github/scripts
      - name: Ruff format check
        run: uv run ruff format --check tests .github/scripts
      - name: Repository tests
        run: uv run pytest tests -n 2 --junitxml=reports/repository.xml
      - name: Keep the test reports (TKT-26)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-python-repository
          path: reports/
          if-no-files-found: ignore

  packages:
    if: inputs.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install the workspace
        run: uv sync --locked
      - name: Ruff check
        run: uv run ruff check backend scripts
      - name: Ruff format check
        run: uv run ruff format --check backend scripts
      - name: Mypy
        run: |
          found=0
          for src in backend/libs/*/src backend/swarm-*/src backend/apps/*/src scripts/src; do
            if [ -d "$src" ]; then
              found=1
              uv run mypy "$src" || exit 1
            fi
          done
          if [ "$found" = 0 ]; then
            echo "No source folder in backend or scripts: mypy is not applicable."
          fi
      - name: JSON Schema bundle is up to date
        run: uv run swarm-schemas-check
      - name: Every Python message is in English, French, German and Spanish
        run: uv run swarm-i18n-check
      - name: Keep the test reports (TKT-26)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-python-packages
          path: reports/
          if-no-files-found: ignore
