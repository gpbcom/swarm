name: automerge

# TKT-15: a ticket's pull request to develop, labelled automerge by ticket_tree.py finish, is merged (merge commit,
# GitFlow) as soon as every check of its head commit has passed. GitHub's own auto-merge needs branch protection,
# which a private repository of a free account does not have; this workflow plays its part.
# TKT-26: a release (release/<version>, opened by release.yml) is merged into master the same way, with RELEASE_TOKEN,
# then tagged v<version>, published as a GitHub release, and brought back to develop by a pull request of its own.
# TKT-25: once merged into develop, the head branch is deleted (never develop or master), unless it moved since.

# L-61: a label added after every check has passed starts no workflow_run, so the labelling itself starts it too.

on:
  workflow_run:
    workflows: [ci, gitflow, terraform, desktop]
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: automerge-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  merge:
    # Any run of the commit, pull request or push: the last one to end is the one that may merge (TKT-26). A push to a
    # branch without an open pull request at that commit does nothing.
    # A pull request labelled automerge is looked at once, at its head commit, whatever its checks say: the step
    # waits for them, and the last run that ends merges it.
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'automerge')
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request when every check passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
        run: |
          found=$(gh pr list -R "$REPO" --head "$HEAD_BRANCH" --state open --json number,baseRefName,headRefOid,labels \
            --jq '[.[] | select((.baseRefName == "develop" or .baseRefName == "master") and .headRefOid == env.HEAD_SHA and any(.labels[]; .name == "automerge"))] | first | select(. != null) | "\(.number) \(.baseRefName)"')
          if [ -z "$found" ]; then
            echo "No open pull request to develop or master labelled automerge at $HEAD_SHA."
            exit 0
          fi
          read -r pr base <<< "$found"
          states=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name != "merge") | (.conclusion // .status)] | unique | join(" ")')
          echo "Checks of #$pr: $states"
          for state in $states; do
            case "$state" in
              success|skipped|neutral) ;;
              *) echo "#$pr waits: a check is $state."; exit 0 ;;
            esac
          done
          person() {
            if ! gh api "repos/$REPO/issues/$pr/labels" --jq '.[].name' | grep -qx needs-person; then
              gh api -X POST "repos/$REPO/issues/$pr/labels" -f "labels[]=needs-person" --silent
              gh api -X POST "repos/$REPO/issues/$pr/comments" --silent -f body="$1"
            fi
            echo "#$pr: left to a person."
            exit 0
          }
          release=false
          case "$HEAD_BRANCH" in release/*|hotfix/*) release=true ;; esac
          if [ "$base" = master ]; then
            # TKT-26: only a release or a hotfix goes to master, merged with RELEASE_TOKEN, which may carry CI changes.
            [ "$release" = true ] || { echo "#$pr: only release/ and hotfix/ go to master."; exit 0; }
            [ -n "$RELEASE_TOKEN" ] || person "✅ Every check passed, but the secret RELEASE_TOKEN is missing: a release cannot reach master by itself (TKT-26)."
            version="${HEAD_BRANCH#*/}"
            version="${version#v}"
            GH_TOKEN="$RELEASE_TOKEN" gh pr merge "$pr" -R "$REPO" --merge --match-head-commit "$HEAD_SHA" \
              --subject "Release v$version: merge $HEAD_BRANCH into master (#$pr)"
            sha=$(gh pr view "$pr" -R "$REPO" --json mergeCommit --jq .mergeCommit.oid)
            if ! gh api "repos/$REPO/contents/docs/releases/v$version/RELEASE_NOTES.md?ref=$sha" \
              -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/notes.md"; then
              echo "Swarm v$version, merged by #$pr." > "$RUNNER_TEMP/notes.md"
            fi
            GH_TOKEN="$RELEASE_TOKEN" gh release create "v$version" -R "$REPO" --target "$sha" \
              --title "Swarm v$version" --notes-file "$RUNNER_TEMP/notes.md"
            # GitHub deletes the head branch of a merge made with a person's token: bring it back at the released commit.
            if ! gh api "repos/$REPO/git/ref/heads/$HEAD_BRANCH" > /dev/null 2>&1; then
              GH_TOKEN="$RELEASE_TOKEN" gh api -X POST "repos/$REPO/git/refs" -f "ref=refs/heads/$HEAD_BRANCH" -f "sha=$HEAD_SHA" --silent
              echo "Recreated $HEAD_BRANCH at $HEAD_SHA for its way back to develop."
            fi
            GH_TOKEN="$RELEASE_TOKEN" gh pr create -R "$REPO" --base develop --head "$HEAD_BRANCH" --label automerge \
              --title "Release v$version: back to develop" \
              --body "Brings the changelog, the release notes and the test reports of v$version (#$pr) back to develop (TKT-26)."
            echo "Merged #$pr into master, tagged and released v$version, and opened its way back to develop."
            exit 0
          fi
          token="$GH_TOKEN"
          if [ "$release" = true ] && [ -n "$RELEASE_TOKEN" ]; then
            # The way back of a release: what it carries is already on master.
            token="$RELEASE_TOKEN"
          elif gh api "repos/$REPO/pulls/$pr/files?per_page=100" --jq '.[].filename' | grep -q '^\.github/workflows/'; then
            # GitHub never lets GITHUB_TOKEN change .github/workflows/: a change to CI is merged by a person (TKT-15).
            person "✅ Every check passed. This pull request changes \`.github/workflows/\`, which GitHub lets only a person merge: merge it with a merge commit (TKT-15)."
          fi
          GH_TOKEN="$token" gh pr merge "$pr" -R "$REPO" --merge --match-head-commit "$HEAD_SHA" \
            --subject "$(gh pr view "$pr" -R "$REPO" --json title --jq '.title | split(":")[0]'): merge $HEAD_BRANCH into develop (#$pr)"
          echo "Merged #$pr into develop."
          # TKT-25: a branch lives as long as its work. Never develop or master; never one that moved or is still used.
          case "$HEAD_BRANCH" in
            develop|master|main) echo "$HEAD_BRANCH is never deleted." ;;
            *)
              current=$(gh api "repos/$REPO/git/ref/heads/$HEAD_BRANCH" --jq .object.sha 2> /dev/null || true)
              others=$(gh pr list -R "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq 'length')
              if [ "$current" = "$HEAD_SHA" ] && [ "$others" = 0 ]; then
                gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_BRANCH" --silent
                echo "Deleted $HEAD_BRANCH: develop holds its work (TKT-25)."
              else
                echo "Kept $HEAD_BRANCH: it moved since, or another pull request uses it."
              fi
              ;;
          esac
