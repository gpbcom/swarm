name: automerge

# TKT-15: a ticket's pull request to develop, labelled automerge by ticket_tree.py finish, is merged (merge commit,
# GitFlow) as soon as every check of its head commit has passed. GitHub's own auto-merge needs branch protection,
# which a private repository of a free account does not have; this workflow plays its part.

on:
  workflow_run:
    workflows: [ci, gitflow, terraform]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request when every check passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list -R "$REPO" --head "$HEAD_BRANCH" --state open --json number,baseRefName,headRefOid,labels \
            --jq '.[] | select(.baseRefName == "develop" and .headRefOid == env.HEAD_SHA and any(.labels[]; .name == "automerge")) | .number')
          if [ -z "$pr" ]; then
            echo "No open pull request to develop labelled automerge at $HEAD_SHA."
            exit 0
          fi
          states=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name != "merge") | (.conclusion // .status)] | unique | join(" ")')
          echo "Checks of #$pr: $states"
          for state in $states; do
            case "$state" in
              success|skipped|neutral) ;;
              *) echo "#$pr waits: a check is $state."; exit 0 ;;
            esac
          done
          gh pr merge "$pr" -R "$REPO" --merge --match-head-commit "$HEAD_SHA" \
            --subject "$(gh pr view "$pr" -R "$REPO" --json title --jq '.title | split(":")[0]'): merge $HEAD_BRANCH into develop (#$pr)"
          echo "Merged #$pr into develop."
