name: dev-cell

on:
  workflow_dispatch:
    inputs:
      action:
        description: Create (up) or destroy (down) the dev cell of the branch.
        type: choice
        required: true
        options:
          - up
          - down
      branch:
        description: Branch of the dev cell. Defaults to the dispatching ref.
        type: string
        required: false
  delete:

permissions:
  contents: read

concurrency:
  group: dev-cell-${{ github.event.ref || inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  cell:
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch'
    runs-on: ${{ vars.DEV_CELL_RUNNER || 'ubuntu-latest' }}
    env:
      ACTION: ${{ github.event_name == 'delete' && 'down' || inputs.action }}
      BRANCH: ${{ github.event_name == 'delete' && github.event.ref || inputs.branch || github.ref_name }}
      TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
      DEV_CELL_TFVARS: ${{ secrets.DEV_CELL_TFVARS }}
      DEV_CELL_KUBECONFIG: ${{ secrets.DEV_CELL_KUBECONFIG }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.10"
          terraform_wrapper: false
      - name: Write the secrets to files
        run: |
          set -eu
          umask 077
          missing=0
          for name in TF_BACKEND_CONFIG DEV_CELL_TFVARS DEV_CELL_KUBECONFIG; do
            if [ -z "${!name:-}" ]; then
              echo "::error::The secret $name is missing or empty."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          printf '%s\n' "$TF_BACKEND_CONFIG" > "$RUNNER_TEMP/backend.hcl"
          printf '%s\n' "$DEV_CELL_TFVARS" > "$RUNNER_TEMP/dev-cell.tfvars"
          printf '%s\n' "$DEV_CELL_KUBECONFIG" > "$RUNNER_TEMP/kubeconfig"
          printf 'kubeconfig_path = "%s"\n' "$RUNNER_TEMP/kubeconfig" >> "$RUNNER_TEMP/dev-cell.tfvars"
      - name: Create or destroy the dev cell
        env:
          DEV_CELL_BACKEND_CONFIG: ${{ runner.temp }}/backend.hcl
          DEV_CELL_VAR_FILE: ${{ runner.temp }}/dev-cell.tfvars
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: bash deploy/scripts/dev-cell.sh "$ACTION" "$BRANCH"
