name: gitflow

# TKT-15: every pull request follows GitFlow. feature/ and bugfix/ go to develop; release/ and hotfix/ go to master,
# and come back to develop; a ticket's pull request (feature/<ID>) is titled with its ID.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch, its base and the title
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$HEAD" in
            feature/*|bugfix/*) [ "$BASE" = develop ] || fail "$HEAD goes to develop, not $BASE." ;;
            release/*|hotfix/*) [ "$BASE" = master ] || [ "$BASE" = develop ] || fail "$HEAD goes to master (then develop), not $BASE." ;;
            master) [ "$BASE" = develop ] || fail "master only comes back to develop." ;;
            *) fail "$HEAD is not a GitFlow branch: feature/, bugfix/, release/ or hotfix/." ;;
          esac
          ticket=$(printf '%s' "$HEAD" | sed -n 's#^feature/\(T[0-9]*\.[0-9][0-9]\)$#\1#p')
          if [ -n "$ticket" ]; then
            case "$TITLE" in "$ticket:"*|"$ticket "*) ;; *) fail "The title of a ticket's pull request starts with $ticket." ;; esac
          fi
          echo "GitFlow: $HEAD -> $BASE"
