name: TypeScript

on:
  workflow_call:
    inputs:
      projects:
        description: Compact JSON array of the TypeScript project paths to check.
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    if: inputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
    env:
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter "./$PROJECT" run --if-present lint
      - name: Type check
        run: pnpm --filter "./$PROJECT" run --if-present typecheck
      - name: Test
        run: pnpm --filter "./$PROJECT" run --if-present test
