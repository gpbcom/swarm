[package]
name = "swarm-synthetic-drones"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Synthetic Drones of the Swarm simulator: they speak MAVLink over UDP and follow routes."

[lints]
workspace = true

[dependencies]
mavlink = { version = "=0.21.0", default-features = false, features = ["std", "dialect-common", "transport-udp", "mav2-message-extensions"] }

opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics"] }
swarm-observability = { path = "../swarm-observability" }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "step"
harness = false
