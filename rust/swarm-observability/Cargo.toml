[package]
name = "swarm-observability"
version = "0.1.0"
edition.workspace = true
publish = false
description = "The OpenTelemetry signals of Swarm services written in Rust: traces and metrics over OTLP/HTTP, with secrets removed and drone_id kept off metrics."

[lints]
workspace = true

[dependencies]
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "spec_unstable_metrics_views"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "metrics"] }
thiserror = "2"

[dev-dependencies]
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "spec_unstable_metrics_views", "testing"] }
