[workspace]
resolver = "2"
members = [
    "swarm-core/mavlink",
    "swarm-core/planner",
    "swarm-core/python",
    "swarm-core/safety",
    "swarm-models",
    "swarm-models-codegen",
    "swarm-synthetic-drones",
]

[workspace.package]
edition = "2021"

[workspace.dependencies]
criterion = "0.8.2"
pyo3 = "0.30.1"

# Every member crate opts in to these lints with `[lints] workspace = true`.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
missing_docs = "warn"
