[project]
name = "swarm-nats"
version = "0.1.0"
description = "The shared async NATS client of Swarm, and the issuers of its NATS accounts and credentials."
readme = "../../../README.md"
requires-python = ">=3.12"
dependencies = [
    "nats-py[nkeys]>=2.11.0",
    "nkeys>=0.2.1",
    "pydantic>=2.14.3",
    "swarm-lifecycle",
    "swarm-models",
]

[tool.uv.sources]
swarm-lifecycle = { workspace = true }
swarm-models = { workspace = true }

[tool.uv.build-backend]
module-name = "swarm_nats"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
