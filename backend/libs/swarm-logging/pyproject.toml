[project]
name = "swarm-logging"
version = "0.1.0"
description = "The logging configuration (coloured console and rotating file, JSON in production)."
readme = "../../../README.md"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.45.2",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[tool.uv.build-backend]
module-name = "swarm_logging"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
