[project]
name = "swarm-web"
version = "0.1.0"
description = "The HTTP kernel of Swarm: the FastAPI application builder, the uvicorn server runnable and the entity tags."
readme = "../../../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.164.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.14.3",
    "swarm-catalog",
    "swarm-lifecycle",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
]

[tool.uv.sources]
swarm-catalog = { workspace = true }
swarm-lifecycle = { workspace = true }

[tool.uv.build-backend]
module-name = "swarm_web"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
