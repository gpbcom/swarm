[project]
name = "swarm-models"
version = "0.1.0"
description = "The shared Pydantic models of Swarm, and the JSON Schema they export."
readme = "../../../README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14.3"]

[project.scripts]
swarm-models-schemas = "swarm_models.api.cli.export_schemas:main"

[tool.uv.build-backend]
module-name = "swarm_models"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
