[project]
name = "swarm-clients"
version = "0.1.0"
description = "The clients layer of Swarm: one client per remote system, a folder per domain."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "nats-py>=2.11.0",
    "pydantic>=2.14.3",
    "pymavlink>=2.4.49",
    "swarm-models",
    "swarm-nats",
]

[tool.uv.sources]
swarm-models = { workspace = true }
swarm-nats = { workspace = true }

[tool.uv.build-backend]
module-name = "swarm_clients"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
