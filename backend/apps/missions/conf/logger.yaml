# Logging configuration of the missions service, copied from the reference of swarm_logging.
version: 1
disable_existing_loggers: false
formatters:
  coloured:
    (): swarm_logging.formatters.coloured_formatter.ColouredFormatter
    format: "%(asctime)s %(levelname)-8s %(name)s: %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stderr
    level: DEBUG
    formatter: coloured
  file:
    class: logging.handlers.RotatingFileHandler
    filename: logs/missions.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    level: DEBUG
    formatter: coloured
root:
  level: DEBUG
  handlers: [console, file]
