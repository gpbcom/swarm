[project]
name = "swarm-missions"
version = "0.1.0"
description = "The Swarm missions app: its main() reads conf/app.yaml and serves the missions domain."
readme = "../../../README.md"
requires-python = ">=3.12"
dependencies = [
    "swarm-api",
    "swarm-logging",
    "swarm-models",
    "swarm-web",
]

[project.scripts]
swarm-missions-serve = "swarm_missions.main:main"

[tool.swarm]
domains = ["missions"]

[tool.uv.build-backend]
module-name = "swarm_missions"

[tool.uv.sources]
swarm-api = { workspace = true }
swarm-logging = { workspace = true }
swarm-models = { workspace = true }
swarm-web = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
