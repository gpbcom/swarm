# The configuration of the fleet service, with every default written out.
# The DSN itself is never written here: postgres.dsn_key names the environment entry that holds it.
schema_name: fleet
postgres:
  dsn_key: SWARM_FLEET_POSTGRES_DSN
  pool_min_size: 1
  pool_max_size: 5
  command_timeout_s: 5.0
  status_interval_s: 5.0
rest:
  host: 0.0.0.0
  port: 8000
  status_interval_s: 5.0
  idempotency_ttl_s: 86400.0
  idempotency_max_entries: 10000
signals:
  enabled: false
  endpoint: http://otel-collector:4318
  service_name: swarm-fleet
  cell: local
  metrics_interval_s: 60.0
  redactions_path: null
