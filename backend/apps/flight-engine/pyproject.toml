[project]
name = "swarm-flight-engine"
version = "0.1.0"
description = "The Swarm flight engine service."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.164.0",
    "uvicorn[standard]>=0.30.0",
    "uvloop>=0.21.0",
    "ormsgpack>=1.7.0",
    "nats-py>=2.11.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0",
    "swarm-lifecycle",
    "swarm-logging",
    "swarm-catalog",
    "swarm-models",
    "swarm-nats",
    "swarm-live",
]

[project.scripts]
swarm-flight-engine = "flight_engine.api.cli.main:main"

[tool.uv.build-backend]
module-name = "flight_engine"

[tool.uv.sources]
swarm-lifecycle = { workspace = true }
swarm-logging = { workspace = true }
swarm-catalog = { workspace = true }
swarm-models = { workspace = true }
swarm-nats = { workspace = true }
swarm-live = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
