# The configuration of the flight engine service, with every default written out.
tick_interval_ms: 50
status_interval_s: 5.0
link_lost_after_ms: 5000
missions_catalog_path: conf/catalogs/missions.yaml
drone_states_catalog_path: conf/catalogs/drone_states.yaml
nats:
  servers:
    - nats://127.0.0.1:4222
  name: swarm
  credentials_path: null
  connect_timeout_s: 2.0
  reconnect_wait_s: 2.0
  request_deadline_s: 5.0
live:
  host: 127.0.0.1
  port: 8080
  status_interval_s: 5.0
