schema_name: gateway
postgres:
  dsn_key: SWARM_GATEWAY_POSTGRES_DSN
  pool_min_size: 1
  pool_max_size: 5
  command_timeout_s: 5.0
  status_interval_s: 5.0
rest:
  host: 0.0.0.0
  port: 8000
  status_interval_s: 5.0
  idempotency_ttl_s: 86400.0
  idempotency_max_entries: 10000
auth:
  issuer_url: http://keycloak.global.svc.cluster.local:8080/realms/swarm
  audience: swarm-gateway
  jwks_cache_ttl_s: 300.0
  leeway_s: 0.0
  request_timeout_s: 5.0
live:
  status_interval_s: 5.0
  nats:
    servers:
      - nats://127.0.0.1:4222
    name: swarm
    credentials_path: null
    connect_timeout_s: 2.0
    reconnect_wait_s: 2.0
    request_deadline_s: 5.0
  session:
    status_interval_s: 5.0
operators:
  cell: dev
  keycloak:
    server_url: http://keycloak.global.svc.cluster.local:8080
    realm: swarm
    client_id: swarm-gateway-admin
    client_secret_key: SWARM_GATEWAY_KEYCLOAK_CLIENT_SECRET
    sign_in_client_id: back-office
    request_timeout_s: 5.0
signals:
  enabled: false
  endpoint: http://otel-collector:4318
  service_name: swarm-gateway
  cell: local
  metrics_interval_s: 60.0
  redactions_path: null
