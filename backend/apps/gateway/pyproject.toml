[project]
name = "swarm-gateway"
version = "0.1.0"
description = "The Swarm gateway app: its main() reads conf/app.yaml and serves the gateway domain."
readme = "../../../README.md"
requires-python = ">=3.12"
dependencies = [
    "swarm-api",
    "swarm-logging",
    "swarm-models",
    "swarm-web",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
swarm-gateway-serve = "swarm_gateway.main:main"

[tool.swarm]
domains = ["gateway"]

[tool.uv.build-backend]
module-name = "swarm_gateway"

[tool.uv.sources]
swarm-api = { workspace = true }
swarm-logging = { workspace = true }
swarm-models = { workspace = true }
swarm-web = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
