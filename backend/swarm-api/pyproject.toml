[project]
name = "swarm-api"
version = "0.1.0"
description = "The api layer of Swarm: FastAPI endpoints and versioned routers, their middlewares and exception handlers."
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.164.0",
    "swarm-models",
    "swarm-service",
    "swarm-web",
]

[tool.uv.sources]
swarm-models = { workspace = true }
swarm-service = { workspace = true }
swarm-web = { workspace = true }

[tool.uv.build-backend]
module-name = "swarm_api"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
