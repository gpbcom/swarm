[project]
name = "swarm-live"
version = "0.1.0"
description = "The shared live stream of Swarm: MessagePack frames over WebSocket."
readme = "../../../README.md"
requires-python = ">=3.12"
dependencies = [
    "ormsgpack>=1.7.0",
    "pydantic>=2.14.3",
    "starlette>=0.40.0",
    "swarm-lifecycle",
    "swarm-models",
]

[tool.uv.sources]
swarm-lifecycle = { workspace = true }
swarm-models = { workspace = true }

[tool.uv.build-backend]
module-name = "swarm_live"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
