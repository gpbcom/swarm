[project]
name = "swarm-rest"
version = "0.1.0"
description = "The shared REST layer of Swarm services: FastAPI application, server and errors."
readme = "../../../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.164.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.14.3",
    "swarm-lifecycle",
]

[tool.uv.sources]
swarm-lifecycle = { workspace = true }

[tool.uv.build-backend]
module-name = "swarm_rest"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
