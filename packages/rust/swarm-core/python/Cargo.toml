[package]
name = "swarm-core-python"
version = "0.1.0"
edition.workspace = true
publish = false
description = "PyO3 bindings of the Swarm core, built into the swarm_core wheel by maturin."

[lints]
workspace = true

# `test = false` and `doctest = false` keep `cargo test --workspace` from linking libpython.
[lib]
name = "swarm_core"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pyo3.workspace = true
swarm-core-safety = { path = "../safety" }
swarm-core-planner = { path = "../planner" }
swarm-core-mavlink = { path = "../mavlink" }
