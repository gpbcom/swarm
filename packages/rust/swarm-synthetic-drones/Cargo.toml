[package]
name = "swarm-synthetic-drones"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Synthetic Drones of the Swarm simulator: they speak MAVLink over UDP and follow routes."

[lints]
workspace = true

[dependencies]
mavlink = { version = "=0.16.2", default-features = false, features = ["std", "common", "udp", "emit-extensions"] }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "step"
harness = false
