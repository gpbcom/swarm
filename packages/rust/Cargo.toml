[workspace]
resolver = "2"
members = []

[workspace.package]
edition = "2021"

# Every member crate opts in to these lints with `[lints] workspace = true`.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
missing_docs = "warn"
