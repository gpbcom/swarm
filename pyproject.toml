[project]
name = "swarm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "babel>=2.18.0",
    "fastapi>=0.164.0",
    "langchain>=1.5.0",
    "langgraph>=1.2.22",
    "pydantic>=2.14.3",
]

[project.scripts]
swarm = "swarm:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=11.0",
]
