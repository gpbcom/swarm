[tool.uv.workspace]
members = ["services/*", "packages/python/*"]

[dependency-groups]
dev = [
    "maturin>=1.7",
    "mypy>=1.10",
    "pillow>=11.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.5",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# AGENT.md (Typing) requires Optional, List, Dict, Tuple, Set and Union from typing: the pyupgrade rules that
# rewrite them are ignored so that the linter follows the project's rule.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.isort]
# Tests are written before the code they import (TKT-4): pinning ``tests`` as first-party keeps the import order the
# same whether or not the imported module exists yet. The code of the repository is first-party, so that the AGENT.md
# import groups match ruff.
known-first-party = ["tests", "gateway", "swarm_catalog", "swarm_lifecycle", "swarm_logging", "swarm_models"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = [
    "tests",
    "services/gateway/tests",
    "packages/python/swarm-lifecycle/tests",
    "packages/python/swarm-catalog/tests",
    "packages/python/swarm-logging/tests",
    "packages/python/swarm-models/tests",
]

[tool.mypy]
files = [
    "services/gateway/src",
    "packages/python/swarm-lifecycle/src",
    "packages/python/swarm-catalog/src",
    "packages/python/swarm-logging/src",
    "packages/python/swarm-models/src",
]
mypy_path = [
    "services/gateway/src",
    "packages/python/swarm-lifecycle/src",
    "packages/python/swarm-catalog/src",
    "packages/python/swarm-logging/src",
    "packages/python/swarm-models/src",
]
explicit_package_bases = true
