[tool.uv.workspace]
members = ["services/*", "packages/python/*"]

[dependency-groups]
dev = [
    "maturin>=1.7",
    "mypy>=1.10",
    "pillow>=11.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.5",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# AGENT.md (Typing) requires Optional, List, Dict, Tuple, Set and Union from typing: the pyupgrade rules that
# rewrite them are ignored so that the linter follows the project's rule.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.isort]
# Tests are written before the code they import (TKT-4): pinning ``tests`` as first-party keeps the import order the
# same whether or not the imported module exists yet.
known-first-party = ["tests"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests", "services/gateway/tests"]

[tool.mypy]
files = ["services/gateway/src"]
mypy_path = ["services/gateway/src"]
explicit_package_bases = true
